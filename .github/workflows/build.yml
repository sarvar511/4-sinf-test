name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Kodni olish
        uses: actions/checkout@v4

      - name: Python o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Java o'rnatish
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Kerakli paketlarni o'rnatish
        run: |
          sudo apt update
          sudo apt install -y \
            git zip unzip autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libtinfo5 \
            cmake libffi-dev libssl-dev automake

      - name: Buildozer o'rnatish
        run: |
          pip install --upgrade pip
          pip install buildozer cython==0.29.34

      - name: APK yaratish
        run: |
          buildozer android debug

      - name: APKni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: 4-sinf-test-apk
          path: bin/*.apk
